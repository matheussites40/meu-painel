<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Meu Painel</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .login {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .cadastro {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }

        #mensagem {
            margin-top: 15px;
            text-align: center;
            color: #dc2626;
        }
    </style>
</head>

<body>

    <div class="login">

        <h1>🏠 Meu Painel</h1>

        <form id="loginForm">

            <label>E-mail</label>

            <input
                type="email"
                id="email"
                placeholder="seu@email.com"
                required
            >

            <label>Senha</label>

            <input
                type="password"
                id="senha"
                placeholder="Sua senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <div id="mensagem"></div>

        <a class="cadastro" href="cadastro.html">
            Ainda não tenho uma conta
        </a>

    </div>

    <script type="module">

        import { createClient }
        from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

        const SUPABASE_URL = "https://wihlexxxfitxenapakwx.supabase.co/rest/v1/";

        const SUPABASE_KEY = "sb_publishable_c539WLncRhwid_ksB1qFmw_eBNO49ou";

        const supabase = createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const form = document.getElementById("loginForm");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value;

            const senha =
                document.getElementById("senha").value;

            const mensagem =
                document.getElementById("mensagem");

            mensagem.textContent = "Entrando...";

            const { error } =
                await supabase.auth.signInWithPassword({
                    email: email,
                    password: senha
                });

            if (error) {

                mensagem.textContent =
                    "E-mail ou senha incorretos.";

                return;
            }

            window.location.href = "index.html";

        });

    </script>

</body>
</html>
