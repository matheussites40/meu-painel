<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Criar conta - Meu Painel</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .cadastro {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,.1);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #16a34a;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
        }

        #mensagem {
            margin-top: 15px;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="cadastro">

    <h1>📝 Criar conta</h1>

    <form id="formCadastro">

        <label>E-mail</label>

        <input
            type="email"
            id="email"
            required
        >

        <label>Senha</label>

        <input
            type="password"
            id="senha"
            minlength="6"
            required
        >

        <button type="submit">
            Criar minha conta
        </button>

    </form>

    <div id="mensagem"></div>

    <a href="login.html">
        Já tenho uma conta
    </a>

</div>

<script type="module">

    import { createClient }
    from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://wihlexxxfitxenapakwx.supabase.co";

    const SUPABASE_KEY = "sb_publishable_c539WLncRhwid_ksB1qFmw_eBNO49ou";

    const supabase = createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    document
        .getElementById("formCadastro")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value;

            const senha =
                document.getElementById("senha").value;

            const mensagem =
                document.getElementById("mensagem");

            mensagem.textContent = "Criando conta...";

            const { error } =
                await supabase.auth.signUp({
                    email: email,
                    password: senha
                });

            if (error) {

                mensagem.textContent =
                    error.message;

                return;
            }

            mensagem.style.color = "green";

            mensagem.textContent =
                "Conta criada! Verifique seu e-mail para confirmar.";

        });

</script>

</body>

</html>
